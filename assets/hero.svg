<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none" role="img" aria-label="agent-card — publish a card, get discovered, accept a connection, get messaged">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b4dff"/>
      <stop offset="0.42" stop-color="#5a32d8"/>
      <stop offset="0.76" stop-color="#36208f"/>
      <stop offset="1" stop-color="#1c1150"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.16" cy="-0.1" r="0.7">
      <stop offset="0" stop-color="#ff78d2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff78d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.98" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#4ad6c8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4ad6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ad6c8"/>
      <stop offset="1" stop-color="#a77bff"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glowP)"/>
    <rect width="1200" height="320" fill="url(#glowT)"/>

    <!-- network of agents: links, pulsing nodes, and messages travelling between them -->
    <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5">
      <line x1="130" y1="86" x2="300" y2="232"/>
      <line x1="300" y1="232" x2="560" y2="150"/>
      <line x1="560" y1="150" x2="520" y2="60"/>
      <line x1="560" y1="150" x2="880" y2="238"/>
      <line x1="880" y1="238" x2="1080" y2="104"/>
      <line x1="520" y1="60" x2="1080" y2="104"/>
    </g>
    <g fill="#ffffff">
      <circle r="3" opacity="0.9"><animateMotion dur="3.2s" repeatCount="indefinite" path="M130,86 L300,232"/></circle>
      <circle r="3" opacity="0.9"><animateMotion dur="2.6s" begin="0.6s" repeatCount="indefinite" path="M560,150 L520,60"/></circle>
      <circle r="3" opacity="0.9"><animateMotion dur="3.6s" begin="1.1s" repeatCount="indefinite" path="M560,150 L880,238"/></circle>
      <circle r="3" opacity="0.9"><animateMotion dur="3.0s" begin="0.3s" repeatCount="indefinite" path="M520,60 L1080,104"/></circle>
    </g>
    <g>
      <circle cx="130" cy="86" r="6" fill="#4ad6c8"><animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="232" r="6" fill="#a77bff"><animate attributeName="r" values="5;8;5" dur="3.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;1;0.55" dur="3.4s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="60" r="6" fill="#4ad6c8"><animate attributeName="r" values="5;8;5" dur="2.8s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;1;0.55" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="238" r="6" fill="#a77bff"><animate attributeName="r" values="5;8;5" dur="3.2s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;1;0.55" dur="3.2s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="104" r="6" fill="#4ad6c8"><animate attributeName="r" values="5;8;5" dur="3.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;1;0.55" dur="3.6s" begin="1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- moving sheen -->
    <g opacity="0.1" transform="skewX(-16)">
      <rect x="-360" y="-60" width="150" height="440" fill="#ffffff">
        <animateTransform attributeName="transform" type="translate" from="-200 0" to="1700 0" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- wordmark -->
    <g transform="translate(600 150)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text y="0" font-size="76" font-weight="800" letter-spacing="-2.5" fill="#ffffff">agent<tspan fill="url(#teal)">-card</tspan></text>
      <rect x="-150" y="22" width="300" height="4" rx="2" fill="url(#teal)" opacity="0.9">
        <animate attributeName="width" values="0;300" dur="1s" fill="freeze"/>
        <animate attributeName="x" values="0;-150" dur="1s" fill="freeze"/>
      </rect>
      <text y="60" font-size="22" font-weight="500" fill="#ffffff" fill-opacity="0.76">Publish a card&#160; ·&#160; get discovered&#160; ·&#160; accept a connection&#160; ·&#160; get messaged</text>
    </g>
  </g>
</svg>
